<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>FilmoraHub</title>
        <link rel="stylesheet" type="text/css" href="Estilos/estilo.css">
        <script src="script.js"></script>
    </head>
    <body>
        <header id="sup">
            <h1>FilmoraHub</h1>
        </header>
        <nav id="opciones">
            <input id="añadirPelicula" type="button" value="Añadir Pelicula">
            <input id="añadirNoticia" type="button" value="Añadir Noticia">
            <input id="buscador" type="text" placeholder="Buscador...">
        </nav>
        <div id="cuerpo"> 
            <section id="noticias">
                <h4>Ultimas Noticias</h4>
            </section>
            <main id="peliculas">
                <h4>Peliculas</h4>
                <hr>
                <section id="accion">
                    <h5>Peliculas de accion</h5>
                    <div id="divAccion"></div>
                </section>
                <hr>
                <section id="comedia">
                    <h5>Peliculas de comedia</h5>
                    <div id="divComedia"></div>
                </section>
                <hr>
                <section id="Drama">
                    <h5>Peliculas de Drama</h5>
                    <div id="divDrama"></div>
                </section>
            </main>
        </div>
    </body>
</html>
